    });
  }

  return { mount(container){ el = container; bindGlobalActions(); render(); }, reset };
})();

/* ============================= TOOL: PAGE NUMBERING ============================= */
const NumbersTool = (()=>{
  let state = null; let el = null;
  const POS_OPTS = [
    { id:'header-left', label:'Header Left' }, { id:'header-center', label:'Header Center' }, { id:'header-right', label:'Header Right' },
    { id:'footer-left', label:'Footer Left' }, { id:'footer-center', label:'Footer Center' }, { id:'footer-right', label:'Footer Right' },
  ];
  function freshState(){
    return {
      file:null, pageCount:0, previewUrl:null,
      cfg:{ position:'footer-center', format:'n', fontSize:12, color:'#A3A3A3', start:1, skipFirst:false },
      phase:'empty', resultBlob:null, resultName:'numbered.pdf'
    };
  }
  function reset(){ state = freshState(); render(); }
  reset();

  async function loadFile(files){
    const file = files[0]; if (!file || !validatePdfFile(file)) return;
    state = freshState(); state.phase = 'loading'; render();
    try{
      const buf = await file.arrayBuffer();
      const libDoc = await loadPdfLibDoc(new Uint8Array(buf).slice());
      const pdfjsDoc = await loadPdfJsDoc(new Uint8Array(buf));
      const canvas = await renderThumbCanvas(pdfjsDoc, 1, 420);
      state.file = { name:file.name, size:file.size, bytes: buf };
      state.pageCount = libDoc.getPageCount();
      state.previewUrl = canvas.toDataURL('image/png');
      state.phase = 'ready';
      render();
    }catch(e){ showToast('error', e.message || 'Could not read this PDF.'); reset(); }
  }

  function formatLabel(fmt, n, total){
    if (fmt==='n') return `${n}`;
    if (fmt==='n_total') return `${n} / ${total}`;
    return `Page ${n} of ${total}`;
  }

  function previewOverlayCSS(pos){
    const isHeader = pos.startsWith('header');
    const align = pos.endsWith('left') ? 'flex-start' : pos.endsWith('right') ? 'flex-end' : 'center';
    return `position:absolute; left:0; right:0; ${isHeader?'top:14px;':'bottom:14px;'} display:flex; justify-content:${align}; padding:0 20px;`;
  }

  function previewHTML(){
    const c = state.cfg;
    const skip = c.skipFirst;
    return `
    <div class="relative rounded-lg overflow-hidden border border-border bg-neutral-100 mx-auto" style="max-width:340px;">
      <img src="${state.previewUrl}" class="w-full h-auto block" />
      ${skip ? `<div class="absolute top-2 left-2 bg-neutral-100/85 border border-border text-[10px] text-neutral-600 px-2 py-1 rounded-md">Page 1 skipped</div>` : `
      <div style="${previewOverlayCSS(c.position)}">
        <span style="color:${c.color}; font-size:${Math.max(9,c.fontSize*0.7)}px; font-weight:600;">${formatLabel(c.format, c.start, state.pageCount)}</span>
      </div>`}
    </div>`;
  }
  function updatePreview(){ const h = el.querySelector('[data-preview-holder]'); if (h) h.innerHTML = previewHTML(); }

  function computeXY(pos, w, h, textW, fontSize, pad=28){
    let x, y;
    if (pos.endsWith('left')) x = pad;
    else if (pos.endsWith('right')) x = w - textW - pad;
    else x = (w - textW)/2;
    y = pos.startsWith('header') ? (h - pad - fontSize) : pad;
    return { x, y };
  }

  async function runApply(){
    state.phase = 'processing'; render();
    try{
      const doc = await PDFDocument.load(new Uint8Array(state.file.bytes).slice(), { ignoreEncryption:true });
      const font = await doc.embedFont(StandardFonts.Helvetica);
      const { r,g,b } = hexToRgb01(state.cfg.color);
      const pages = doc.getPages();
      const total = state.cfg.skipFirst ? pages.length - 1 : pages.length;
      for (let i=0;i<pages.length;i++){
        updateStatus(`Numbering page ${i+1} of ${pages.length}&hellip;`);
        if (state.cfg.skipFirst && i===0){ if (i%15===0) await sleep(0); continue; }
        const n = state.cfg.start + (i - (state.cfg.skipFirst?1:0));
        const label = formatLabel(state.cfg.format, n, total);
        const { width, height } = pages[i].getSize();
        const tw = font.widthOfTextAtSize(label, state.cfg.fontSize);
        const { x, y } = computeXY(state.cfg.position, width, height, tw, state.cfg.fontSize);
        pages[i].drawText(label, { x, y, size: state.cfg.fontSize, font, color: rgb(r,g,b) });
        if (i % 15 === 0) await sleep(0);
      }
      const bytes = await doc.save();
      state.resultBlob = new Blob([bytes], { type:'application/pdf' });
      state.phase = 'done';
      downloadBlob(state.resultBlob, state.resultName);
      showToast('success','Page numbers added successfully.');
    }catch(e){ showToast('error', `Failed to add page numbers &mdash; ${e.message}`); state.phase='ready'; }
    render();
  }
  function updateStatus(text){ const s = el && el.querySelector('[data-status]'); if (s) s.textContent = text; }

  function configPanelHTML(){
    const c = state.cfg;
    return `
    <div class="space-y-5">
      <div>
        <label class="block text-[12px] font-medium text-neutral-600 mb-2">Position</label>
        <div class="grid grid-cols-3 gap-2">
          ${POS_OPTS.map(p=>`<button data-numpos="${p.id}" class="tab-btn ${c.position===p.id?'active':'text-neutral-600 bg-neutral-100'} text-[11.5px] font-medium px-2 py-2 rounded-lg border border-border">${p.label}</button>`).join('')}
        </div>
      </div>
      <div>
        <label class="block text-[12px] font-medium text-neutral-600 mb-2">Format</label>
        <select data-numformat class="w-full bg-neutral-100 border border-border rounded-lg px-3 py-2.5 text-[13px] text-neutral-800 focus:outline-none focus:border-accent/60">
          <option value="n" ${c.format==='n'?'selected':''}>1</option>
          <option value="n_total" ${c.format==='n_total'?'selected':''}>1 / 10</option>
          <option value="page_of" ${c.format==='page_of'?'selected':''}>Page 1 of 10</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-[12px] font-medium text-neutral-600 mb-2">Font size <span class="text-neutral-400 mono">${c.fontSize}px</span></label>
          <input type="range" min="8" max="28" data-numfontsize value="${c.fontSize}" class="w-full" />
        </div>
        <div>
          <label class="block text-[12px] font-medium text-neutral-600 mb-2">Color</label>
          <input type="color" data-numcolor value="${c.color}" />
        </div>
      </div>
      <div>
        <label class="block text-[12px] font-medium text-neutral-600 mb-2">Starting number</label>
        <input type="number" min="0" data-numstart value="${c.start}" class="w-28 bg-neutral-100 border border-border rounded-lg px-3 py-2 text-[13px] text-neutral-800 focus:outline-none focus:border-accent/60 mono" />
      </div>
      <label class="flex items-center gap-2.5 cursor-pointer select-none">
        <input type="checkbox" data-numskip ${c.skipFirst?'checked':''} class="w-4 h-4 rounded accent-accent" />
        <span class="text-[13px] text-neutral-700">Skip first page (e.g. cover page)</span>
      </label>
    </div>`;
  }

  function render(){
    if (!el) return;
    if (state.phase === 'empty'){
      el.innerHTML = dropzoneHTML({ title:'Drop PDF here or click to browse', subtitle:'A single PDF file up to 50MB' });
      wireDropzone(el, { multiple:false, onFiles: loadFile });
      return;
    }
    if (state.phase === 'loading'){ el.innerHTML = processingHTML('Reading document&hellip;'); return; }
    if (state.phase === 'processing'){ el.innerHTML = processingHTML('Adding page numbers&hellip;'); return; }
    if (state.phase === 'done'){ el.innerHTML = successHTML({ title:'Page numbers added', subtitle:'Your document now includes page numbers.', filename: state.resultName }); return; }

    el.innerHTML = `
      ${fileMetaBarHTML({ name: state.file.name, size: state.file.size, pageCount: state.pageCount })}
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <p class="text-[12px] font-medium text-neutral-500 mb-3 uppercase tracking-wide">Live preview &middot; page 1</p>
          <div data-preview-holder>${previewHTML()}</div>
        </div>
        <div class="bg-surface border border-border rounded-xl p-5">${configPanelHTML()}</div>
      </div>
      <div class="mt-6">${ctaButtonHTML('Apply & Download', { iconName:'hash' })}</div>
    `;
    el.querySelectorAll('[data-numpos]').forEach(b=> b.addEventListener('click', ()=>{ state.cfg.position = b.dataset.numpos; render(); }));
    const fmt = el.querySelector('[data-numformat]'); if (fmt) fmt.addEventListener('change', e=>{ state.cfg.format = e.target.value; updatePreview(); });
    const fs = el.querySelector('[data-numfontsize]'); if (fs) fs.addEventListener('input', e=>{ state.cfg.fontSize = +e.target.value; render(); });
    const col = el.querySelector('[data-numcolor]'); if (col) col.addEventListener('input', e=>{ state.cfg.color = e.target.value; updatePreview(); });
    const start = el.querySelector('[data-numstart]'); if (start) start.addEventListener('input', e=>{ state.cfg.start = Math.max(0, +e.target.value||0); updatePreview(); });
    const skip = el.querySelector('[data-numskip]'); if (skip) skip.addEventListener('change', e=>{ state.cfg.skipFirst = e.target.checked; render(); });
    const cta = el.querySelector('[data-action="run"]'); if (cta) cta.addEventListener('click', runApply);
  }

  function bindGlobalActions(){
    el.addEventListener('click', e=>{
      const t = e.target.closest('[data-action]');
      if (!t) return;
      if (t.dataset.action === 'start-over' || t.dataset.action === 'reset-tool') reset();
      if (t.dataset.action === 'download-again' && state.resultBlob) downloadBlob(state.resultBlob, state.resultName);
    });
  }

  return { mount(container){ el = container; bindGlobalActions(); render(); }, reset };
})();

const OCR_LANGS = [

  { code:'ara', label:'Arabic' }, { code:'chi_sim', label:'Chinese (Simplified)' },
  { code:'chi_tra', label:'Chinese (Traditional)' }, { code:'fra', label:'French' },
  { code:'deu', label:'German' }, { code:'ita', label:'Italian' }, { code:'jpn', label:'Japanese' },
  { code:'kor', label:'Korean' }, { code:'nld', label:'Dutch' }, { code:'por', label:'Portuguese' },
  { code:'rus', label:'Russian' }, { code:'spa', label:'Spanish' }, { code:'tha', label:'Thai' },
  { code:'vie', label:'Vietnamese' },
];
const OCR_QUALITY_SCALE = { fast: 150/72, balanced: 200/72, best: 300/72 };

function parsePageIndices(input, pageCount){
  if (!input || !input.trim()) return { indices: Array.from({length:pageCount}, (_,i)=>i) };
  const parts = input.split(',').map(s=>s.trim()).filter(Boolean);
  const set = new Set();
  for (const part of parts){
    const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if (m){
      let a = parseInt(m[1],10), b = parseInt(m[2],10);
      if (a>b) [a,b] = [b,a];
      if (a<1 || b>pageCount) return { error:`Range "${part}" is out of bounds (1&ndash;${pageCount}).` };
      for (let i=a;i<=b;i++) set.add(i-1);
    } else if (/^\d+$/.test(part)){
      const n = parseInt(part,10);
      if (n<1 || n>pageCount) return { error:`Page ${n} is out of bounds (1&ndash;${pageCount}).` };
      set.add(n-1);
    } else {
      return { error:`Couldn&rsquo;t understand "${part}". Use formats like 1-3, 5, 7-9.` };
    }
  }
  return { indices: Array.from(set).sort((a,b)=>a-b) };
}

function extractOcrWords(data){
  if (Array.isArray(data.words) && data.words.length) return data.words;
  const words = [];
  const blocks = data.blocks || [];
  for (const block of blocks){
    for (const para of (block.paragraphs || [])){
      for (const line of (para.lines || [])){
        for (const w of (line.words || [])) words.push(w);
      }
    }
  }
  return words;
}

function friendlyOcrStatus(status){
  const map = {
    'loading tesseract core': 'Loading OCR engine&hellip;',
    'initializing tesseract': 'Initializing OCR engine&hellip;',
    'loading language traineddata': 'Downloading language data (first use only)&hellip;',
    'initializing api': 'Preparing&hellip;',
  };
  return map[status] || (status.charAt(0).toUpperCase() + status.slice(1));
}

async function createOcrWorker(langs, onProgress){
  // Which worker-loading strategy works depends on how this page is hosted:
  //  - Opened directly as a file (file:// — origin "null"): needs workerBlobURL:true,
  //    since a direct cross-origin Worker(url) is blocked, but a same-document blob: URL
  //    (built from a CORS-fetched copy of the script) is not.
  //  - Deeply sandboxed iframe without allow-same-origin (e.g. some in-chat file previews):
  //    the opposite — blob: URLs are blocked there, so workerBlobURL:false (load the
  //    worker script directly from its CDN URL) is what works.
  // Rather than guessing, try both and use whichever succeeds.
  const langArg = langs.join('+');
  let lastErr = null;
  for (const workerBlobURL of [true, false]){
    const opts = { logger: onProgress, workerBlobURL };
    try{ return await Tesseract.createWorker(langs, 1, opts); }
    catch(e){ lastErr = e; }
    try{ return await Tesseract.createWorker(langArg, 1, opts); }
    catch(e){ lastErr = e; }
  }
  throw lastErr;
}

const OcrTool = (()=>{
  let state = null; let el = null;

  function freshState(){
    return {
      file:null, pageCount:0, thumbs:[],
      outputType:'text', langs:new Set(['ind','eng']), quality:'balanced', pageRangeInput:'',
      phase:'empty', resultBlob:null, resultName:'ocr_result.txt',
    };
  }
  function resetPreservingConfig(){
    const keep = state ? { outputType: state.outputType, langs: new Set(state.langs), quality: state.quality } : null;
    state = freshState();
    if (keep){ state.outputType = keep.outputType; state.langs = keep.langs; state.quality = keep.quality; }
  }
  function reset(){ resetPreservingConfig(); render(); }
  reset();

  async function loadFile(files){
    const file = files[0]; if (!file || !validatePdfFile(file)) return;
    resetPreservingConfig(); state.phase = 'loading'; render();
    try{
      const buf = await file.arrayBuffer();
      const libDoc = await loadPdfLibDoc(new Uint8Array(buf).slice());
      const pageCount = libDoc.getPageCount();
      const pdfjsDoc = await loadPdfJsDoc(new Uint8Array(buf));
      state.file = { name:file.name, size:file.size, bytes: buf };
      state.pageCount = pageCount;
      state.phase = 'ready';
      render();
      for (let i=1;i<=pageCount;i++){
        const canvas = await renderThumbCanvas(pdfjsDoc, i, 160);
        state.thumbs[i-1] = canvas.toDataURL('image/png');
        const holder = el.querySelector(`[data-thumb="${i-1}"]`);
        if (holder) holder.innerHTML = `<img src="${state.thumbs[i-1]}" class="w-full h-full object-contain" />`;
        if (i % 6 === 0) await sleep(0);
      }
    }catch(e){ showToast('error', e.message || 'Could not read this PDF.'); reset(); }
  }

  function updateStatus(text){ const s = el && el.querySelector('[data-status]'); if (s) s.textContent = text; }

  async function runOcr(){
    const langs = Array.from(state.langs);
    if (!langs.length){ showToast('error','Select at least one language.'); return; }
    const parsed = parsePageIndices(state.pageRangeInput, state.pageCount);
    if (parsed.error){ showToast('error', parsed.error); return; }
    const indices = parsed.indices;
    if (!indices.length){ showToast('error','No pages selected to OCR.'); return; }

    state.phase = 'processing'; render();
    let worker = null;
    try{
      updateStatus('Loading OCR engine&hellip;');
      await ensureTesseractLoaded();

      let currentPageDisplay = 0;
      worker = await createOcrWorker(langs, m=>{
        if (m.status === 'recognizing text' && typeof m.progress === 'number'){
          updateStatus(`Recognizing page ${currentPageDisplay} of ${indices.length} &mdash; ${Math.round(m.progress*100)}%`);
        } else if (m.status){
          updateStatus(friendlyOcrStatus(m.status));
        }
      });

      const pdfjsDoc = await loadPdfJsDoc(new Uint8Array(state.file.bytes));
      const scale = OCR_QUALITY_SCALE[state.quality];
      const pageResults = [];
      for (let i=0;i<indices.length;i++){
        currentPageDisplay = i+1;
        const pageIndex = indices[i];
        updateStatus(`Rendering page ${pageIndex+1}&hellip;`);
        const page = await pdfjsDoc.getPage(pageIndex+1);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(viewport.width); canvas.height = Math.ceil(viewport.height);
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;
        updateStatus(`Recognizing page ${i+1} of ${indices.length}&hellip;`);
        const { data } = await worker.recognize(canvas, {}, { blocks:true });
        const words = extractOcrWords(data);
        pageResults.push({ pageIndex, text: data.text || '', words, scale });
        await sleep(0);
      }

      await worker.terminate(); worker = null;

      if (state.outputType === 'text'){
        updateStatus('Assembling text file&hellip;');
        const text = pageResults.map(r => `----- Page ${r.pageIndex+1} -----\n\n${r.text.trim()}`).join('\n\n\n');
        state.resultBlob = new Blob([text], { type:'text/plain;charset=utf-8' });
        state.resultName = state.file.name.replace(/\.pdf$/i,'') + '_ocr.txt';
      } else {
        updateStatus('Building searchable PDF&hellip;');
        const doc = await PDFDocument.load(new Uint8Array(state.file.bytes).slice(), { ignoreEncryption:true });
        const font = await doc.embedFont(StandardFonts.Helvetica);
        const pages = doc.getPages();
        for (const r of pageResults){
          const page = pages[r.pageIndex];
          const { height: pageHeightPt } = page.getSize();
          page.pushOperators(setTextRenderingMode(TextRenderingMode.Invisible));
          for (const w of r.words){
            if (!w || !w.text || !w.text.trim() || !w.bbox) continue;
            const bboxH = w.bbox.y1 - w.bbox.y0, bboxW = w.bbox.x1 - w.bbox.x0;
            if (bboxH <= 0 || bboxW <= 0) continue;
            const fontSizePt = bboxH / r.scale;
            const xPt = w.bbox.x0 / r.scale;
            const yPt = pageHeightPt - (w.bbox.y1 / r.scale);
            try{ page.drawText(w.text, { x:xPt, y:yPt, size: Math.max(1,fontSizePt), font, color: rgb(0,0,0) }); }
            catch(e){ /* skip glyphs the standard font can't encode */ }
          }
          page.pushOperators(setTextRenderingMode(TextRenderingMode.Fill));
        }
        const bytes = await doc.save();
        state.resultBlob = new Blob([bytes], { type:'application/pdf' });
        state.resultName = state.file.name.replace(/\.pdf$/i,'') + '_searchable.pdf';
      }

      state.phase = 'done';
      downloadBlob(state.resultBlob, state.resultName);
      showToast('success', state.outputType==='text' ? 'Text extracted successfully.' : 'Searchable PDF created successfully.');
    }catch(e){
      console.error(e);
      showToast('error', `OCR failed &mdash; ${(e && e.message) || e}`);
      state.phase = 'ready';
      if (worker){ try{ await worker.terminate(); }catch(_){ /* noop */ } }
    }
    render();
  }

  function render(){
    if (!el) return;
    if (state.phase === 'empty'){
      el.innerHTML = dropzoneHTML({ title:'Drop PDF here or click to browse', subtitle:'A single PDF file up to 50MB' });
      wireDropzone(el, { multiple:false, onFiles: loadFile });
      return;
    }
    if (state.phase === 'loading'){ el.innerHTML = processingHTML('Reading document&hellip;'); return; }
    if (state.phase === 'processing'){ el.innerHTML = processingHTML('Starting&hellip;'); return; }
    if (state.phase === 'done'){
      el.innerHTML = successHTML({
        title: state.outputType==='text' ? 'Text extracted' : 'Searchable PDF created',
        subtitle: state.outputType==='text' ? 'Your text file is ready to download.' : 'Your PDF now has a selectable, searchable text layer.',
        filename: state.resultName,
      });
      return;
    }

    el.innerHTML = `
      ${fileMetaBarHTML({ name: state.file.name, size: state.file.size, pageCount: state.pageCount })}
      <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2 mb-6">
        ${Array.from({length: state.pageCount}).map((_,i)=>`
          <div data-thumb="${i}" class="thumb-canvas aspect-[3/4] rounded-md border border-border overflow-hidden flex items-center justify-center">
            ${state.thumbs[i] ? `<img src="${state.thumbs[i]}" class="w-full h-full object-contain" />` : `<div class="spin text-neutral-300">${icon('loader','w-4 h-4')}</div>`}
          </div>`).join('')}
      </div>
      <div class="bg-surface border border-border rounded-xl p-5 space-y-5">
        <div>
          <label class="block text-[12px] font-medium text-neutral-600 mb-2">Output</label>
          <div class="flex gap-1 bg-neutral-100 rounded-lg p-1 w-fit">
            <button data-outtype="text" class="tab-btn ${state.outputType==='text'?'active':'text-neutral-600'} text-[13px] font-medium px-4 py-1.5 rounded-md">Extract Text (.txt)</button>
            <button data-outtype="searchable" class="tab-btn ${state.outputType==='searchable'?'active':'text-neutral-600'} text-[13px] font-medium px-4 py-1.5 rounded-md">Searchable PDF</button>
          </div>
        </div>
        <div>
          <label class="block text-[12px] font-medium text-neutral-600 mb-2">Language(s) <span class="text-neutral-400 font-normal">&middot; select all that apply</span></label>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-2 max-h-40 overflow-y-auto pr-1">
            ${OCR_LANGS.map(l=>`
              <label class="flex items-center gap-2 cursor-pointer select-none text-[13px] text-neutral-700">
                <input type="checkbox" data-lang="${l.code}" ${state.langs.has(l.code)?'checked':''} class="w-3.5 h-3.5 rounded accent-accent" />
                ${l.label}
              </label>`).join('')}
          </div>
          <p class="text-[11.5px] text-neutral-400 mt-2">Each language downloads a small data pack the first time it&rsquo;s used (cached after that).</p>
        </div>
        <div>
          <label class="block text-[12px] font-medium text-neutral-600 mb-2">Quality</label>
          <div class="flex gap-1 bg-neutral-100 rounded-lg p-1 w-fit">
            ${[['fast','150 DPI &middot; Fast'],['balanced','200 DPI &middot; Balanced'],['best','300 DPI &middot; Best']].map(([v,l])=>`<button data-quality="${v}" class="tab-btn ${state.quality===v?'active':'text-neutral-600'} text-[12.5px] font-medium px-3 py-1.5 rounded-md">${l}</button>`).join('')}
          </div>
        </div>
        <div>
          <label class="block text-[12px] font-medium text-neutral-600 mb-2">Pages</label>
          <input data-pagerange value="${escapeHtml(state.pageRangeInput)}" placeholder="Leave blank for all pages, or e.g. 1-3, 5" class="w-full bg-neutral-100 border border-border rounded-lg px-3.5 py-2.5 text-[13px] text-neutral-800 placeholder:text-neutral-400 focus:outline-none focus:border-accent/60 mono" />
        </div>
      </div>
      <div class="mt-6">${ctaButtonHTML(state.outputType==='text' ? 'Extract Text & Download' : 'Create Searchable PDF & Download', { iconName:'scanText' })}</div>
    `;

    el.querySelectorAll('[data-outtype]').forEach(b=> b.addEventListener('click', ()=>{ state.outputType = b.dataset.outtype; render(); }));
    el.querySelectorAll('[data-lang]').forEach(cb=> cb.addEventListener('change', e=>{
      if (e.target.checked) state.langs.add(cb.dataset.lang); else state.langs.delete(cb.dataset.lang);
    }));
    el.querySelectorAll('[data-quality]').forEach(b=> b.addEventListener('click', ()=>{ state.quality = b.dataset.quality; render(); }));
    const rangeInput = el.querySelector('[data-pagerange]');
    if (rangeInput) rangeInput.addEventListener('input', e=>{ state.pageRangeInput = e.target.value; });
    const cta = el.querySelector('[data-action="run"]'); if (cta) cta.addEventListener('click', runOcr);
  }

  function bindGlobalActions(){
    el.addEventListener('click', e=>{
      const t = e.target.closest('[data-action]');
      if (!t) return;
      if (t.dataset.action === 'start-over' || t.dataset.action === 'reset-tool') reset();
      if (t.dataset.action === 'download-again' && state.resultBlob) downloadBlob(state.resultBlob, state.resultName);
    });
  }

  return { mount(container){ el = container; bindGlobalActions(); render(); }, reset };
})();

/* ============================= TOOL: COMPRESS PDF ============================= */
const CompressTool = (()=>{
  let state = null; let el = null;
  const LEVELS = {
    low:      { label:'Less Compression',    dpi:150, quality:0.85 },
    balanced: { label:'Recommended',         dpi:120, quality:0.70 },
    high:     { label:'Extreme Compression', dpi:96,  quality:0.45 },
  };

  function freshState(){
    return {
      file:null, pageCount:0, thumbs:[], level:'balanced',
      phase:'empty', resultBlob:null, resultName:'compressed.pdf',
      originalSize:0, compressedSize:0,
    };
  }
  function reset(){ const keepLevel = state ? state.level : 'balanced'; state = freshState(); state.level = keepLevel; render(); }
  reset();

  async function loadFile(files){
    const file = files[0]; if (!file || !validatePdfFile(file)) return;
    const keepLevel = state ? state.level : 'balanced';
    state = freshState(); state.level = keepLevel; state.phase = 'loading'; render();
    try{
      const buf = await file.arrayBuffer();
      const libDoc = await loadPdfLibDoc(new Uint8Array(buf).slice());
      const pageCount = libDoc.getPageCount();
      const pdfjsDoc = await loadPdfJsDoc(new Uint8Array(buf));
      state.file = { name:file.name, size:file.size, bytes: buf };
      state.pageCount = pageCount;
      state.originalSize = file.size;
      state.phase = 'ready';
      render();
      for (let i=1;i<=pageCount;i++){
        const canvas = await renderThumbCanvas(pdfjsDoc, i, 160);
        state.thumbs[i-1] = canvas.toDataURL('image/png');
        const holder = el.querySelector(`[data-thumb="${i-1}"]`);
        if (holder) holder.innerHTML = `<img src="${state.thumbs[i-1]}" class="w-full h-full object-contain" />`;
        if (i % 6 === 0) await sleep(0);
      }
    }catch(e){ showToast('error', e.message || 'Could not read this PDF.'); reset(); }
  }

  function updateStatus(text){ const s = el && el.querySelector('[data-status]'); if (s) s.textContent = text; }

  async function runCompress(){
    const cfg = LEVELS[state.level];
    state.phase = 'processing'; render();
    try{
      const srcDoc = await PDFDocument.load(new Uint8Array(state.file.bytes).slice(), { ignoreEncryption:true });
      const srcPages = srcDoc.getPages();
      const pdfjsDoc = await loadPdfJsDoc(new Uint8Array(state.file.bytes));
      const outDoc = await PDFDocument.create();
      const scale = cfg.dpi / 72;

      for (let i=0;i<state.pageCount;i++){
        updateStatus(`Compressing page ${i+1} of ${state.pageCount}&hellip;`);
        const { width: ptW, height: ptH } = srcPages[i].getSize();
        const page = await pdfjsDoc.getPage(i+1);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(viewport.width));
        canvas.height = Math.max(1, Math.round(viewport.height));
        const ctx = canvas.getContext('2d');
        // Fill white first so transparent regions don't turn black once JPEG-encoded (no alpha channel).
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport }).promise;
        const blob = await new Promise(res=> canvas.toBlob(res, 'image/jpeg', cfg.quality));
        const bytes = new Uint8Array(await blob.arrayBuffer());
        const embedded = await outDoc.embedJpg(bytes);
        const outPage = outDoc.addPage([ptW, ptH]);
        outPage.drawImage(embedded, { x:0, y:0, width:ptW, height:ptH });
        if (i % 5 === 0) await sleep(0);
      }

      updateStatus('Finalizing&hellip;');
      const outBytes = await outDoc.save();
      state.compressedSize = outBytes.byteLength;
      state.resultBlob = new Blob([outBytes], { type:'application/pdf' });
      state.resultName = state.file.name.replace(/\.pdf$/i,'') + '_compressed.pdf';
      state.phase = 'done';
      downloadBlob(state.resultBlob, state.resultName);
      const pct = Math.round((1 - state.compressedSize/state.originalSize) * 100);
      showToast('success', pct>0 ? `Compressed successfully &mdash; ${pct}% smaller.` : 'Compression complete.');
    }catch(e){
      showToast('error', `Compression failed &mdash; ${e.message}`);
      state.phase = 'ready';
    }
    render();
  }

  function sizeCompareHTML(){
    if (!state.compressedSize) return '';
    const pct = Math.round((1 - state.compressedSize/state.originalSize) * 100);
    const good = pct > 0;
    return `
    <div class="flex items-center justify-center gap-4 mb-2">
      <div class="text-center">
        <p class="text-[11px] text-neutral-400 uppercase tracking-wide mb-1">Original</p>
        <p class="text-[15px] font-semibold text-neutral-700 mono">${formatBytes(state.originalSize)}</p>
      </div>
      <div class="text-neutral-400">${icon('chevronLeft','w-4 h-4 rotate-180')}</div>
      <div class="text-center">
        <p class="text-[11px] text-neutral-400 uppercase tracking-wide mb-1">Compressed</p>
        <p class="text-[15px] font-semibold ${good?'text-emerald-600':'text-neutral-700'} mono">${formatBytes(state.compressedSize)}</p>
      </div>
    </div>
    ${good ? `<p class="text-center text-[13px] text-emerald-600 font-medium mb-1">${pct}% smaller</p>` : `<p class="text-center text-[13px] text-neutral-500 mb-1">Already efficiently sized</p>`}
    `;
  }

  function render(){
    if (!el) return;
    if (state.phase === 'empty'){
      el.innerHTML = dropzoneHTML({ title:'Drop PDF here or click to browse', subtitle:'A single PDF file up to 50MB' });
      wireDropzone(el, { multiple:false, onFiles: loadFile });
      return;
    }
    if (state.phase === 'loading'){ el.innerHTML = processingHTML('Reading document&hellip;'); return; }
    if (state.phase === 'processing'){ el.innerHTML = processingHTML('Starting&hellip;'); return; }
    if (state.phase === 'done'){
      el.innerHTML = `
        <div class="fade-in flex flex-col items-center justify-center py-16 text-center">
          <div class="check-pop w-16 h-16 rounded-full bg-emerald-500/15 flex items-center justify-center mb-5">
            <svg class="w-8 h-8 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline class="check-draw" points="20 6 9 17 4 12"/></svg>
          </div>
          <p class="text-[17px] font-semibold text-neutral-900 mb-4">Compressed successfully</p>
          ${sizeCompareHTML()}
          <div class="flex items-center gap-3 mt-6">
            <button data-action="download-again" class="btn-primary text-white text-[13px] font-medium px-5 py-2.5 rounded-xl flex items-center gap-2">${icon('download','w-4 h-4')} Download ${escapeHtml(state.resultName)}</button>
            <button data-action="start-over" class="text-[13px] font-medium px-5 py-2.5 rounded-xl border border-border text-neutral-700 hover:bg-black/5 flex items-center gap-2">${icon('refresh','w-4 h-4')} Start Over</button>
          </div>
        </div>`;
      return;
    }

    el.innerHTML = `
      ${fileMetaBarHTML({ name: state.file.name, size: state.file.size, pageCount: state.pageCount })}
      <div class="flex items-start gap-2.5 bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/20 rounded-xl px-4 py-3 mb-6">
        <span class="text-amber-500 shrink-0 mt-0.5">${icon('info','w-4 h-4')}</span>
        <p class="text-[12.5px] text-amber-900/90 dark:text-amber-200/90 leading-relaxed">Best for scanned documents and photo-heavy PDFs. Each page is rebuilt as a compressed image, so any selectable/searchable text in the original will be lost.</p>
      </div>
      <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2 mb-6">
        ${Array.from({length: state.pageCount}).map((_,i)=>`
          <div data-thumb="${i}" class="thumb-canvas aspect-[3/4] rounded-md border border-border overflow-hidden flex items-center justify-center">
            ${state.thumbs[i] ? `<img src="${state.thumbs[i]}" class="w-full h-full object-contain" />` : `<div class="spin text-neutral-300">${icon('loader','w-4 h-4')}</div>`}
          </div>`).join('')}
      </div>
      <div class="bg-surface border border-border rounded-xl p-5">
        <label class="block text-[12px] font-medium text-neutral-600 mb-2">Compression level</label>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          ${Object.entries(LEVELS).map(([key,cfg])=>`
            <button data-level="${key}" class="text-left rounded-lg border ${state.level===key?'border-accent bg-accent/10':'border-border bg-neutral-100 hover:bg-black/5'} px-3.5 py-3 transition-all duration-200">
              <p class="text-[13px] font-medium ${state.level===key?'text-accent':'text-neutral-700'}">${cfg.label}</p>
              <p class="text-[11.5px] text-neutral-500 mono mt-0.5">${cfg.dpi} DPI &middot; ${Math.round(cfg.quality*100)}% quality</p>
            </button>`).join('')}
        </div>
      </div>
      <div class="mt-6">${ctaButtonHTML('Compress & Download', { iconName:'minimize' })}</div>
    `;
    el.querySelectorAll('[data-level]').forEach(b=> b.addEventListener('click', ()=>{ state.level = b.dataset.level; render(); }));
    const cta = el.querySelector('[data-action="run"]'); if (cta) cta.addEventListener('click', runCompress);
  }

  function bindGlobalActions(){
    el.addEventListener('click', e=>{
      const t = e.target.closest('[data-action]');
      if (!t) return;
      if (t.dataset.action === 'start-over' || t.dataset.action === 'reset-tool') reset();
      if (t.dataset.action === 'download-again' && state.resultBlob) downloadBlob(state.resultBlob, state.resultName);
    });
  }

  return { mount(container){ el = container; bindGlobalActions(); render(); }, reset };
})();
